<div class="page">
  <div class="card">
    <div class="card-head__title">
      <span class="header-icon"><i class="pi pi-shield"></i></span>
      <div>
        <h1 class="title">Autorizaciones excepcionales</h1>
        <p class="subtitle">
          Permite liquidar sin asistencia aprobada, con trazabilidad
        </p>
      </div>
    </div>

    <div class="sel-bar">
      <div class="field">
        <label>Período de nómina</label>
        <p-dropdown
          [options]="periodosOpts"
          [(ngModel)]="periodoSel"
          optionLabel="label"
          optionValue="value"
          placeholder="Seleccionar período"
          [style]="{ minWidth: '280px' }"
          (onChange)="cargar()"
        />
      </div>
    </div>

    <ng-container *ngIf="periodoSel != null">
      <!-- Form crear -->
      <div class="crear-box">
        <div class="field">
          <label>Empleado</label>
          <p-dropdown
            [options]="empleadosOpts"
            [(ngModel)]="form.empleadoId"
            optionLabel="label"
            optionValue="value"
            placeholder="Empleado"
            [filter]="true"
            [style]="{ width: '100%' }"
          />
        </div>
        <div class="field">
          <label>Motivo</label>
          <p-dropdown
            [options]="motivos"
            [(ngModel)]="form.motivo"
            optionLabel="label"
            optionValue="value"
            placeholder="Motivo"
            [style]="{ width: '100%' }"
          />
        </div>
        <div class="field grow">
          <label>Observación</label>
          <input
            pInputText
            [(ngModel)]="form.observacion"
            placeholder="Opcional"
          />
        </div>
        <div class="field crear-btn">
          <button
            pButton
            label="Autorizar"
            icon="pi pi-check"
            class="btn-aura"
            [loading]="creando"
            (click)="crear()"
          ></button>
        </div>
      </div>

      <p-table
        [value]="autorizaciones"
        [paginator]="true"
        [rows]="10"
        [rowsPerPageOptions]="[10, 25, 50]"
        [loading]="loading"
        showGridlines
        [tableStyle]="{ 'min-width': '720px' }"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>Empleado</th>
            <th>Motivo</th>
            <th>Observación</th>
            <th class="text-center">Fecha</th>
            <th class="text-center">Estado</th>
            <th class="text-center" style="width: 90px"></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-a>
          <tr [class.row-off]="a.estado === 'ANULADA'">
            <td>{{ a.empleadoNombre }}</td>
            <td>{{ motivoLabel(a.motivo) }}</td>
            <td>{{ a.observacion || "—" }}</td>
            <td class="text-center">
              {{ a.fechaAutorizacion | date: "short" }}
            </td>
            <td class="text-center">
              <p-tag
                [value]="a.estado"
                [severity]="a.estado === 'ACTIVA' ? 'success' : 'secondary'"
                [rounded]="true"
              />
            </td>
            <td class="text-center">
              <button
                pButton
                icon="pi pi-times"
                class="p-button-text p-button-sm p-button-danger"
                pTooltip="Anular"
                *ngIf="a.estado === 'ACTIVA'"
                (click)="anular(a)"
              ></button>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="6">
              <div class="empty-state">
                <i class="pi pi-shield"></i>
                <p>Sin autorizaciones en este período.</p>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </ng-container>
  </div>
</div>

<p-toast />
<p-confirmDialog />
