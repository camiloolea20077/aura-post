<div class="page">
  <div class="card">
    <div class="card-head">
      <div class="card-head__title">
        <span class="header-icon"><i class="pi pi-stopwatch"></i></span>
        <div>
          <h1 class="title">Digitación de asistencia</h1>
          <p class="subtitle">
            Captura la entrada y salida del día por empleado
          </p>
        </div>
      </div>
      <div class="card-head__actions">
        <div class="field-inline">
          <label>Día</label>
          <p-calendar
            [(ngModel)]="fecha"
            dateFormat="yy-mm-dd"
            [showIcon]="true"
            (onSelect)="cargarDia()"
            placeholder="AAAA-MM-DD"
          />
        </div>
        <button
          pButton
          type="button"
          label="Guardar asistencia"
          icon="pi pi-check"
          class="btn-aura"
          [loading]="guardando"
          [disabled]="!filas.length"
          (click)="guardarTodos()"
        ></button>
      </div>
    </div>

    <p-table
      [value]="filas"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [loading]="loading"
      styleClass="p-datatable-sm"
      [tableStyle]="{ 'min-width': '48rem' }"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Empleado</th>
          <th style="width: 12rem">Hora de entrada</th>
          <th style="width: 12rem">Hora de salida</th>
          <th style="width: 10rem">Estado</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-f>
        <tr>
          <td>{{ f.nombre }}</td>
          <td>
            <p-calendar
              [(ngModel)]="f.entrada"
              [timeOnly]="true"
              hourFormat="24"
              [showIcon]="true"
              icon="pi pi-clock"
              appendTo="body"
              placeholder="--:--"
              styleClass="hora-input"
            />
          </td>
          <td>
            <p-calendar
              [(ngModel)]="f.salida"
              [timeOnly]="true"
              hourFormat="24"
              [showIcon]="true"
              appendTo="body"
              icon="pi pi-clock"
              placeholder="--:--"
              styleClass="hora-input"
            />
          </td>
          <td>
            @if (f.estado) {
              <p-tag
                [value]="f.estado"
                [severity]="estadoSeverity(f.estado)"
                [rounded]="true"
              />
            } @else {
              <span class="pend">Sin capturar</span>
            }
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4">
            <div class="empty-state">
              <i class="pi pi-users"></i>
              <p>
                No hay empleados que requieran control de asistencia. Actívalo
                en la ficha de cada empleado.
              </p>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="loadingbody">
        <tr>
          <td colspan="4"><p-skeleton height="2rem" /></td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-toast />
