<p-toast position="top-right" />

<div class="shell" [class.shell--menu-abierto]="menuAbierto">
  <!-- Barra superior (solo teléfono / pantallas chicas) -->
  <header class="barra">
    <button type="button" class="barra-btn" (click)="toggleMenu()" aria-label="Abrir menú">
      <i class="pi" [class.pi-bars]="!menuAbierto" [class.pi-times]="menuAbierto"></i>
    </button>
    <span class="barra-titulo">{{ titulo }}</span>
    <span class="logo-icono logo-icono--chico">CT</span>
  </header>

  <!-- Fondo oscuro detrás del cajón -->
  <div class="velo" *ngIf="menuAbierto" (click)="menuAbierto = false"></div>

  <aside class="lateral">
    <div class="logo">
      <span class="logo-icono">CT</span>
      <div>
        <span class="logo-titulo">Platform</span>
        <span class="logo-sub">Panel de administración</span>
      </div>
    </div>

    <nav class="nav">
      <span class="nav-seccion">General</span>
      <a
        *ngFor="let i of principal"
        class="nav-item"
        [routerLink]="i.route"
        routerLinkActive="activo"
      >
        <i [class]="i.icon"></i>
        <span>{{ i.label }}</span>
      </a>

      <span class="nav-seccion">Soporte</span>
      <a
        *ngFor="let i of soporte"
        class="nav-item"
        [class.nav-item--peligro]="i.peligro"
        [routerLink]="i.route"
        routerLinkActive="activo"
      >
        <i [class]="i.icon"></i>
        <span>{{ i.label }}</span>
      </a>
    </nav>

    <button type="button" class="salir" (click)="logout()">
      <i class="pi pi-sign-out"></i>
      <span>Cerrar sesión</span>
    </button>
  </aside>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
