<p-toast />
<p-confirmDialog [style]="{ width: '420px' }" [breakpoints]="{ '640px': '92vw' }" />

<div class="page">
  <div class="card">
    <div class="card-head">
      <div class="card-head__title">
        <span class="header-icon"><i class="pi pi-sitemap"></i></span>
        <div>
          <h1 class="title">Módulos</h1>
          <p class="subtitle">Catálogo de lo que se le puede dar a una empresa</p>
        </div>
      </div>
      <div class="card-head__actions">
        <div class="card-head__btns">
          <button pButton type="button" icon="pi pi-plus" label="Nuevo módulo" class="btn-aura" (click)="nuevo()"></button>
        </div>
        <div class="card-head__search">
          <span class="search-wrap">
            <i class="pi pi-search"></i>
            <input pInputText class="search-input" [(ngModel)]="search" (ngModelChange)="onSearch()" placeholder="Nombre, código o descripción…" />
            <button *ngIf="search" type="button" class="clear-btn" (click)="limpiar()"><i class="pi pi-times"></i></button>
          </span>
        </div>
      </div>
    </div>

    <div class="lista">
      <div class="lista-cab">
        <span>Módulo</span>
        <span>Código</span>
        <span class="lista-celda--centro">Orden</span>
        <span class="lista-celda--centro">Estado</span>
        <span class="lista-celda--derecha">Acciones</span>
      </div>

      <div class="lista-cargando" *ngIf="cargando">
        <p-skeleton *ngFor="let i of [1, 2, 3, 4, 5]" height="2.6rem" />
      </div>

      <ng-container *ngIf="!cargando">
        <div class="lista-fila lista-fila--click" *ngFor="let m of rows" (click)="submodulos(m)">
          <div class="lista-celda lista-celda--principal">
            <span class="lista-titulo">{{ m.nombre }}</span>
            <span class="lista-sub" *ngIf="m.descripcion">{{ m.descripcion }}</span>
          </div>
          <div class="lista-celda">
            <span class="lista-etiqueta">Código</span>
            <span class="mono">{{ m.codigo }}</span>
          </div>
          <div class="lista-celda lista-celda--centro">
            <span class="lista-etiqueta">Orden</span>
            {{ m.orden }}
          </div>
          <div class="lista-celda lista-celda--centro">
            <span class="lista-etiqueta">Estado</span>
            <p-tag [value]="m.activo ? 'Activo' : 'Inactivo'" [severity]="m.activo ? 'success' : 'secondary'" />
          </div>
          <div class="lista-acciones" (click)="$event.stopPropagation()">
            <button pButton type="button" icon="pi pi-list" class="p-button-text p-button-sm" pTooltip="Submódulos" tooltipPosition="top" (click)="submodulos(m)"></button>
            <button pButton type="button" icon="pi pi-pencil" class="p-button-text p-button-sm" pTooltip="Editar" tooltipPosition="top" (click)="editar(m, $event)"></button>
            <button
              pButton
              type="button"
              [icon]="m.activo ? 'pi pi-eye-slash' : 'pi pi-eye'"
              class="p-button-text p-button-sm"
              [pTooltip]="m.activo ? 'Desactivar' : 'Activar'"
              tooltipPosition="top"
              (click)="toggleActivo(m, $event)"
            ></button>
            <button pButton type="button" icon="pi pi-trash" class="p-button-text p-button-sm p-button-danger" pTooltip="Eliminar" tooltipPosition="top" (click)="confirmarEliminar(m, $event)"></button>
          </div>
        </div>

        <div class="lista-vacia" *ngIf="rows.length === 0">
          <i class="pi pi-sitemap"></i>
          {{ search ? 'Ningún módulo coincide con "' + search + '".' : 'No hay módulos registrados.' }}
        </div>
      </ng-container>
    </div>

    <div class="paginador" *ngIf="total > 0">
      <p-paginator
        [first]="first"
        [rows]="filas"
        [totalRecords]="total"
        [rowsPerPageOptions]="[15, 30, 50]"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="{first}–{last} de {totalRecords}"
        (onPageChange)="onPagina($event)"
      />
    </div>
  </div>
</div>

<p-dialog
  [header]="editTarget ? 'Editar módulo' : 'Nuevo módulo'"
  [(visible)]="showForm"
  [modal]="true"
  [style]="{ width: '560px' }"
  [breakpoints]="{ '640px': '95vw' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="showForm = false"
>
  <app-form-modulo *ngIf="showForm" [modulo]="editTarget" (saved)="onSaved()" (cancelled)="showForm = false" />
</p-dialog>
