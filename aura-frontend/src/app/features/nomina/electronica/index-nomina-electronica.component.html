<p-confirmDialog />

<div class="page">
  <div class="card">
    <!-- ── Header dentro de la card ─────────────────────────── -->
    <div class="card-head">
      <div class="card-head__title">
        <span class="header-icon"><i class="pi pi-file-o"></i></span>
        <div>
          <h1 class="title">Nómina electrónica</h1>
          <p class="subtitle">
            Documentos emitidos a la DIAN: descarga el XML, anula o elimina
          </p>
        </div>
      </div>
      <div class="card-head__actions">
        <button
          pButton
          type="button"
          label="Actualizar"
          icon="pi pi-refresh"
          class="btn-aura"
          (click)="cargar()"
        ></button>
        <div class="card-head__search">
          <span class="search-wrap">
            <i class="pi pi-search"></i>
            <input
              type="text"
              pInputText
              class="search-input"
              placeholder="Buscar empleado, CUNE o documento..."
              [(ngModel)]="searchQuery"
              (input)="onSearch()"
              (keydown.escape)="clearSearch()"
            />
            <button *ngIf="searchQuery" class="clear-btn" (click)="clearSearch()">
              <i class="pi pi-times"></i>
            </button>
          </span>
        </div>
      </div>
    </div>

    <p-table
      [value]="filtrados"
      [loading]="loading"
      dataKey="id"
      styleClass="p-datatable-sm"
      [tableStyle]="{ 'min-width': '60rem' }"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Empleado</th>
          <th>Período</th>
          <th>Documento</th>
          <th class="text-center">Estado</th>
          <th>CUNE</th>
          <th style="width: 12rem"></th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-n>
        <tr [class.row-off]="n.estado === 'ANULADO'">
          <td>{{ n.empleadoNombre || '—' }}</td>
          <td>{{ periodo(n) }}</td>
          <td>{{ documento(n) || '—' }}</td>
          <td class="text-center">
            <p-tag [value]="n.estado" [severity]="estadoSeverity(n.estado)" [rounded]="true" />
          </td>
          <td>
            <code class="cune" *ngIf="n.cune" [pTooltip]="n.cune">{{ n.cune | slice: 0 : 16 }}…</code>
            <span *ngIf="!n.cune">—</span>
          </td>
          <td class="text-right">
            <button
              pButton
              icon="pi pi-download"
              class="p-button-sm p-button-text"
              pTooltip="Descargar XML"
              *ngIf="n.estado === 'ACEPTADO'"
              [disabled]="procesando === n.id"
              (click)="descargarXml(n)"
            ></button>
            <button
              pButton
              icon="pi pi-ban"
              class="p-button-sm p-button-text p-button-danger"
              pTooltip="Nota de ajuste (anular)"
              *ngIf="n.estado === 'ACEPTADO'"
              [disabled]="procesando === n.id"
              (click)="anular(n)"
            ></button>
            <button
              pButton
              icon="pi pi-trash"
              class="p-button-sm p-button-text"
              pTooltip="Eliminar en Factus (solo pruebas)"
              *ngIf="n.estado === 'ACEPTADO'"
              [disabled]="procesando === n.id"
              (click)="eliminarSandbox(n)"
            ></button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="text-center p-4">
            Sin nóminas electrónicas emitidas.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
