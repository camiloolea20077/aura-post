<div class="page">
  <div class="card">
    <!-- Header -->
    <div class="card-head">
      <div class="card-head__title">
        <span class="header-icon"><i class="pi pi-calendar"></i></span>
        <div>
          <h1 class="title">Períodos de Nómina</h1>
          <p class="subtitle">
            Define los períodos de pago para liquidar la nómina
          </p>
        </div>
      </div>
      <button
        pButton
        type="button"
        label="Nuevo período"
        icon="pi pi-plus"
        class="btn-verde"
        (click)="openModal()"
      ></button>
    </div>

    <!-- Skeleton -->
    <div
      *ngIf="loading"
      style="
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      "
    >
      <p-skeleton height="60px" *ngFor="let s of [1, 2, 3]" />
    </div>

    <!-- Empty -->
    <div *ngIf="!loading && periodos.length === 0" class="empty-state">
      <i class="pi pi-calendar"></i>
      <p>
        No hay períodos creados. Crea el primero para empezar a liquidar nómina.
      </p>
      <button
        pButton
        type="button"
        label="Crear período"
        icon="pi pi-plus"
        class="btn-verde p-button-sm"
        (click)="openModal()"
      ></button>
    </div>
    <div class="periodo-list" *ngIf="!loading && periodos.length > 0">
      <div
        *ngFor="let p of periodos"
        class="periodo-item"
        [class.anulado]="p.estado === 'ANULADO'"
      >
        <div class="periodo-left">
          <div class="periodo-icon"><i class="pi pi-calendar-clock"></i></div>
          <div>
            <div class="periodo-fechas">
              {{ fmt(p.fechaInicio) }} — {{ fmt(p.fechaFin) }}
            </div>
            <div class="periodo-id">
              Período #{{ p.id }} · Creado {{ fmt(p.createdAt) }}
            </div>
          </div>
        </div>
        <div class="periodo-right">
          <p-tag
            [value]="estadoLabel(p.estado)"
            [severity]="estadoSeverity(p.estado)"
            [rounded]="true"
          />
          <button
            *ngIf="p.estado !== 'ANULADO' && p.estado !== 'PAGADO'"
            pButton
            type="button"
            icon="pi pi-ban"
            class="p-button-text p-button-danger p-button-sm"
            pTooltip="Anular período"
            tooltipPosition="top"
            (click)="anular(p)"
          ></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal crear período -->
<p-dialog
  header="Nuevo período de nómina"
  [(visible)]="showModal"
  [modal]="true"
  [style]="{ width: '400px' }"
  [closable]="true"
  styleClass="nomina-dialog"
>
  <div class="modal-body">
    <div class="form-grid">
      <div class="field">
        <label>Fecha inicio *</label>
        <p-calendar
          [(ngModel)]="fechaInicio"
          dateFormat="dd/mm/yy"
          appendTo="body"
          [showIcon]="true"
          placeholder="dd/mm/aaaa"
          [style]="{ width: '100%' }"
        />
      </div>
      <div class="field">
        <label>Fecha fin *</label>
        <p-calendar
          [(ngModel)]="fechaFin"
          dateFormat="dd/mm/yy"
          appendTo="body"
          [showIcon]="true"
          placeholder="dd/mm/aaaa"
          [style]="{ width: '100%' }"
        />
      </div>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <button
      pButton
      type="button"
      label="Cancelar"
      icon="pi pi-times"
      class="btn-amarillo"
      (click)="showModal = false"
    ></button>
    <button
      pButton
      type="button"
      label="Crear período"
      icon="pi pi-check"
      class="btn-verde"
      [loading]="saving"
      (click)="crear()"
    ></button>
  </ng-template>
</p-dialog>

<p-toast />
<p-confirmDialog />
