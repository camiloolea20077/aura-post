<p-dialog
  [header]="esEdicion ? 'Editar cargo' : 'Nuevo cargo'"
  [(visible)]="visible"
  (onHide)="cerrar()"
  [modal]="true"
  [style]="{ width: '680px' }"
  [breakpoints]="{ '720px': '95vw' }"
  [draggable]="false"
>
  <form [formGroup]="form" class="dialog-form">
    <div class="form-grid">
      <div class="field">
        <label class="field-label"
          >Código <span class="required">*</span></label
        >
        <input
          type="text"
          pInputText
          formControlName="codigo"
          class="w-full"
          placeholder="Ej. AUX-ADM"
        />
        <small class="field-error" *ngIf="invalido('codigo')"
          >El código es obligatorio (hasta 20 caracteres)</small
        >
      </div>
      <div class="field">
        <label class="field-label">Estado</label>
        <p-select
          formControlName="activo"
          [options]="opcionesEstado"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full"
        />
      </div>
    </div>

    <div class="field">
      <label class="field-label"
        >Nombre del cargo <span class="required">*</span></label
      >
      <input
        type="text"
        pInputText
        formControlName="nombre"
        class="w-full"
        placeholder="Auxiliar administrativo"
      />
      <small class="field-error" *ngIf="invalido('nombre')"
        >El nombre es obligatorio</small
      >
    </div>

    <div class="form-grid tres">
      <div class="field">
        <label class="field-label">Nivel</label>
        <p-select
          formControlName="nivelId"
          [options]="niveles"
          optionLabel="label"
          optionValue="value"
          placeholder="Sin nivel"
          [showClear]="true"
          [filter]="true"
          filterBy="label"
          styleClass="w-full"
        />
      </div>
      <div class="field">
        <label class="field-label">Tipo de cargo</label>
        <p-select
          formControlName="tipoCargoId"
          [options]="tipos"
          optionLabel="label"
          optionValue="value"
          placeholder="Sin tipo"
          [showClear]="true"
          [filter]="true"
          filterBy="label"
          styleClass="w-full"
        />
      </div>
      <div class="field">
        <label class="field-label">Plazas</label>
        <p-inputNumber
          formControlName="plazas"
          [min]="0"
          [useGrouping]="false"
          placeholder="Sin límite"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
        <small class="field-hint">Vacío = sin límite</small>
      </div>
    </div>

    <div class="seccion">Rango salarial</div>
    <div class="form-grid tres">
      <div class="field">
        <label class="field-label">Mínimo</label>
        <p-inputNumber
          formControlName="salarioMinimo"
          mode="currency"
          currency="COP"
          locale="es-CO"
          [maxFractionDigits]="0"
          [min]="0"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
      </div>
      <div class="field">
        <label class="field-label">Referencia</label>
        <p-inputNumber
          formControlName="salarioReferencia"
          mode="currency"
          currency="COP"
          locale="es-CO"
          [maxFractionDigits]="0"
          [min]="0"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
        <small class="field-hint">Se propone al vincular</small>
      </div>
      <div class="field">
        <label class="field-label">Máximo</label>
        <p-inputNumber
          formControlName="salarioMaximo"
          mode="currency"
          currency="COP"
          locale="es-CO"
          [maxFractionDigits]="0"
          [min]="0"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
      </div>
    </div>
    <small class="field-error" *ngIf="errorRango">{{ errorRango }}</small>

    <div class="field">
      <label class="field-label">Misión del cargo</label>
      <textarea
        pTextarea
        formControlName="mision"
        rows="2"
        class="w-full"
      ></textarea>
    </div>
    <div class="field">
      <label class="field-label">Funciones</label>
      <textarea
        pTextarea
        formControlName="funciones"
        rows="4"
        class="w-full"
        placeholder="Una función por línea"
      ></textarea>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <button
      pButton
      label="Cancelar"
      icon="pi pi-times"
      class="btn-amarillo"
      (click)="cerrar()"
    ></button>
    <button
      pButton
      [label]="esEdicion ? 'Actualizar' : 'Guardar'"
      icon="pi pi-check"
      class="btn-verde"
      [loading]="guardando"
      (click)="guardar()"
    ></button>
  </ng-template>
</p-dialog>
