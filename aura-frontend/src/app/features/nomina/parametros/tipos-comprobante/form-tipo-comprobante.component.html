<p-dialog
  [header]="
    esEdicion ? 'Editar tipo de comprobante' : 'Nuevo tipo de comprobante'
  "
  [(visible)]="visible"
  (onHide)="cerrar()"
  [modal]="true"
  [style]="{ width: '620px' }"
  [breakpoints]="{ '680px': '95vw' }"
  [draggable]="false"
>
  <form [formGroup]="form" class="dialog-form">
    <div class="form-grid tres">
      <div class="field">
        <label class="field-label"
          >Código <span class="required">*</span></label
        >
        <input
          type="text"
          pInputText
          formControlName="codigo"
          class="w-full"
          placeholder="Ej. NOMADM"
        />
        <small class="field-error" *ngIf="invalido('codigo')"
          >El código es obligatorio (hasta 20 caracteres)</small
        >
      </div>
      <div class="field">
        <label class="field-label"
          >Prefijo <span class="required">*</span></label
        >
        <input
          type="text"
          pInputText
          formControlName="prefijo"
          class="w-full"
          placeholder="Ej. NOM"
        />
        <small class="field-error" *ngIf="invalido('prefijo')"
          >Hasta 10 letras o números, sin espacios</small
        >
      </div>
      <div class="field">
        <label class="field-label">Estado</label>
        <p-select
          formControlName="activo"
          [options]="opcionesEstado"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full"
        />
      </div>
    </div>

    <div class="field">
      <label class="field-label">Nombre <span class="required">*</span></label>
      <input
        type="text"
        pInputText
        formControlName="nombre"
        class="w-full"
        placeholder="Nómina administrativa"
      />
      <small class="field-error" *ngIf="invalido('nombre')"
        >El nombre es obligatorio</small
      >
    </div>

    <div class="form-grid">
      <div class="field">
        <label class="field-label">Clase <span class="required">*</span></label>
        <p-select
          formControlName="clase"
          [options]="opcionesClase"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full"
        />
        <small class="field-hint">Qué liquida el documento.</small>
      </div>
      <div class="field" *ngIf="esPeriodico">
        <label class="field-label"
          >Frecuencia <span class="required">*</span></label
        >
        <p-select
          formControlName="frecuencia"
          [options]="opcionesFrecuencia"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full"
        />
      </div>
    </div>

    <div class="field">
      <label class="field-label">Tipos de vinculación que admite</label>
      <p-multiSelect
        formControlName="tiposVinculacionIds"
        [options]="tiposVinculacion"
        optionLabel="nombre"
        optionValue="id"
        [filter]="true"
        display="chip"
        styleClass="w-full"
        placeholder="Todos"
      />
      <small class="field-hint"
        >Solo los empleados con esas vinculaciones se pueden agregar al
        documento. Vacío = todos.</small
      >
    </div>

    <div class="field">
      <label class="field-label">Descripción</label>
      <textarea
        pTextarea
        formControlName="descripcion"
        rows="2"
        class="w-full"
      ></textarea>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <button
      pButton
      label="Cancelar"
      icon="pi pi-times"
      class="btn-amarillo"
      (click)="cerrar()"
    ></button>
    <button
      pButton
      [label]="esEdicion ? 'Actualizar' : 'Guardar'"
      icon="pi pi-check"
      class="btn-verde"
      [loading]="guardando"
      (click)="guardar()"
    ></button>
  </ng-template>
</p-dialog>
