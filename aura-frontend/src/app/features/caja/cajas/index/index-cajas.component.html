<div class="page-container">
  <div class="page-header">
    <div class="page-title-area">
      <div class="page-icon"><i class="pi pi-desktop"></i></div>
      <div>
        <h3 class="page-title">Cajas</h3>
        <p class="page-sub">Puntos de venta registrados por sucursal</p>
      </div>
    </div>
    <button
      pButton
      type="button"
      label="Nueva caja"
      icon="pi pi-plus"
      class="btn-aura"
      (click)="openCreate()"
    ></button>
  </div>

  <div class="card">
    <div class="table-toolbar">
      <div class="toolbar-left">
        <span class="p-input-icon-left search-wrap">
          <i class="pi pi-search"></i>
          <input
            type="text"
            pInputText
            class="search-input"
            placeholder="Buscar por nombre o sucursal..."
            [(ngModel)]="searchQuery"
            (input)="onSearch()"
            (keydown.escape)="clearSearch()"
          />
          <button *ngIf="searchQuery" class="clear-btn" (click)="clearSearch()">
            <i class="pi pi-times"></i>
          </button>
        </span>
        <span class="total-badge" *ngIf="!loadingTable">
          {{ totalRecords }} {{ totalRecords === 1 ? "caja" : "cajas" }}
        </span>
      </div>
    </div>

    <p-table
      [value]="items"
      [lazy]="true"
      (onLazyLoad)="loadTable($event)"
      [paginator]="true"
      [rows]="rowSize"
      [totalRecords]="totalRecords"
      [loading]="loadingTable"
      [rowsPerPageOptions]="[10, 15, 25, 50]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}-{last} de {totalRecords}"
      styleClass="aura-table"
      [tableStyle]="{ 'min-width': '550px' }"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="c.nombre" style="min-width: 200px">
            Nombre <p-sortIcon field="c.nombre" />
          </th>
          <th style="min-width: 160px">Sucursal</th>
          <th style="width: 100px" class="text-center">Estado</th>
          <th style="width: 100px" class="text-center">Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-item>
        <tr [class.row-inactiva]="!item.activa">
          <td>
            <div class="cell-caja">
              <div class="caja-avatar"><i class="pi pi-desktop"></i></div>
              <span class="caja-nombre">{{ item.nombre }}</span>
            </div>
          </td>
          <td>
            <span class="sucursal-chip">
              <i class="pi pi-building"></i> {{ item.sucursalNombre }}
            </span>
          </td>
          <td class="text-center">
            <p-tag
              [value]="item.activa ? 'Activa' : 'Inactiva'"
              [severity]="item.activa ? 'success' : 'danger'"
              [rounded]="true"
            />
          </td>
          <td class="text-center">
            <div class="action-buttons">
              <button
                pButton
                icon="pi pi-pencil"
                class="p-button-text p-button-sm action-edit"
                pTooltip="Editar"
                tooltipPosition="top"
                (click)="openEdit(item)"
              ></button>
              <button
                pButton
                icon="pi pi-power-off"
                class="p-button-text p-button-sm p-button-warning action-toggle"
                pTooltip="Desactivar"
                tooltipPosition="top"
                (click)="confirmDelete(item)"
              ></button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4">
            <div class="empty-state">
              <i class="pi pi-desktop"></i>
              <p>
                {{
                  searchQuery ? "Sin resultados" : "No hay cajas registradas"
                }}
              </p>
              <button
                *ngIf="!searchQuery"
                pButton
                label="Crear primera caja"
                icon="pi pi-plus"
                class="btn-aura btn-orange p-button-sm"
                (click)="openCreate()"
              ></button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="loadingbody">
        <tr *ngFor="let s of [1, 2, 3, 4, 5]">
          <td><p-skeleton /></td>
          <td><p-skeleton /></td>
          <td class="text-center">
            <p-skeleton width="70px" styleClass="mx-auto" />
          </td>
          <td class="text-center">
            <p-skeleton width="80px" styleClass="mx-auto" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<app-form-caja
  [displayModal]="showModal"
  [cajaId]="selectedId"
  [slug]="modalSlug"
  (modalClosed)="onModalClosed()"
  (cajaSaved)="onCajaSaved()"
>
</app-form-caja>
<p-toast /><p-confirmDialog />
