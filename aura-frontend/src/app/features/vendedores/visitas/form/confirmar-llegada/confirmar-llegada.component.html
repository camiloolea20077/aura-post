<p-dialog
  header="Confirmar Llegada"
  [(visible)]="visible"
  (onHide)="close()"
  [modal]="true"
  [style]="{ width: '420px' }"
  [draggable]="false"
  [resizable]="false"
>
  <div class="confirm-content">
    <div class="visit-info">
      <div class="info-row">
        <i class="pi pi-map-marker"></i>
        <div>
          <strong>{{ visita?.localNombre }}</strong>
          <p class="text-muted">{{ visita?.localDireccion }}</p>
        </div>
      </div>
      <div class="info-row">
        <i class="pi pi-calendar"></i>
        <span>{{ visita?.fechaProgramada | date: "dd/MM/yyyy" }}</span>
      </div>
    </div>

    <div class="location-actions">
      <p-button
        label="Confirmar con GPS"
        icon="pi pi-map-marker"
        class="p-button-success w-full"
        [loading]="loadingGPS"
        (click)="getLocation()"
      />
      <div class="divider-text">
        <span>ó</span>
      </div>
      <p-button
        label="Confirmar Manualmente"
        icon="pi pi-check"
        class="p-button-outlined w-full"
        [loading]="loading"
        (click)="confirmarManual()"
      />
    </div>

    <div class="observaciones">
      <label class="field-label">Observaciones</label>
      <textarea
        pInputTextarea
        [(ngModel)]="observaciones"
        placeholder="Notas de la visita..."
        rows="3"
        class="w-full"
      ></textarea>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <button
      pButton
      label="Cancelar"
      class="p-button-text"
      (click)="close()"
    ></button>
  </ng-template>
</p-dialog>
