<p-toast />
<p-confirmDialog />

<div class="page">
  <div class="card">
    <div class="card-head">
      <div class="card-head__title">
        <span class="header-icon"><i class="pi pi-list"></i></span>
        <div>
          <h1 class="title">Plan de Cuentas (PUC)</h1>
          <p class="subtitle">Catálogo de cuentas contables de la empresa</p>
        </div>
      </div>
      <div class="card-head__actions">
        <div class="card-head__btns">
          <button
            pButton
            type="button"
            label="Cargar PUC Básico"
            icon="pi pi-download"
            class="p-button-outlined p-button-sm"
            (click)="seedPUC()"
          ></button>
          <button
            pButton
            type="button"
            label="Nueva Cuenta"
            icon="pi pi-plus"
            class="btn-aura"
            (click)="abrirNuevo()"
          ></button>
        </div>
        <div class="card-head__search">
          <span class="search-wrap">
            <i class="pi pi-search"></i>
            <input
              type="text"
              pInputText
              class="search-input"
              [(ngModel)]="search"
              placeholder="Buscar por código o descripción..."
            />
            <button *ngIf="search" class="clear-btn" (click)="search = ''">
              <i class="pi pi-times"></i>
            </button>
          </span>
        </div>
      </div>
    </div>

    <p-table
      [value]="cuentasFiltradas"
      [loading]="loading"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 30, 50, 100]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}-{last} de {totalRecords} cuentas"
      styleClass="p-datatable-sm"
      responsiveLayout="scroll"
      [rowHover]="true"
      showGridlines
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Código</th>
          <th>Nombre</th>
          <th>Tipo</th>
          <th>Naturaleza</th>
          <th>Nivel</th>
          <th>Auxiliar</th>
          <th>Estado</th>
          <th style="width: 80px"></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-c>
        <tr>
          <td>
            <code>{{ c.codigo }}</code>
          </td>
          <td [style.paddingLeft]="(c.nivel - 1) * 1.2 + 'rem'">
            <span [style.fontWeight]="c.nivel <= 2 ? '700' : '400'">{{
              c.nombre
            }}</span>
          </td>
          <td>
            <p-tag [severity]="tipoSeverity(c.tipo)" [value]="c.tipo" />
          </td>
          <td>
            <span
              class="tipo-badge"
              [class.debito]="c.naturaleza === 'DEBITO'"
              [class.credito]="c.naturaleza === 'CREDITO'"
            >
              {{ c.naturaleza === "DEBITO" ? "DB" : "CR" }}
            </span>
          </td>
          <td>{{ c.nivel }}</td>
          <td>
            <i
              [class]="
                c.auxiliar ? 'pi pi-check text-green' : 'pi pi-minus text-muted'
              "
            ></i>
          </td>
          <td>
            <p-tag
              [severity]="c.activa ? 'success' : 'danger'"
              [value]="c.activa ? 'Activa' : 'Inactiva'"
            />
          </td>
          <td>
            <div style="display: flex; gap: 0.25rem">
              <button
                pButton
                icon="pi pi-pencil"
                class="p-button-text p-button-sm p-button-rounded"
                pTooltip="Editar"
                (click)="abrirEditar(c)"
              ></button>
              <button
                pButton
                icon="pi pi-trash"
                class="p-button-text p-button-sm p-button-rounded p-button-danger"
                pTooltip="Desactivar"
                [disabled]="!c.activa"
                (click)="eliminar(c)"
              ></button>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="8" class="empty-row">
            <i class="pi pi-list"></i> No hay cuentas registradas. Usa "Cargar
            PUC Básico" para comenzar.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- ── Dialog crear/editar ──────────────────────────────────────── -->
<p-dialog
  [(visible)]="showDialog"
  [modal]="true"
  [closable]="true"
  [header]="editId ? 'Editar Cuenta' : 'Nueva Cuenta'"
  [style]="{ width: '480px' }"
  [draggable]="false"
>
  <div class="form-grid">
    <div class="form-group">
      <label>Código <span class="req">*</span></label>
      <input
        pInputText
        [(ngModel)]="form.codigo"
        placeholder="Ej: 1105"
        [disabled]="!!editId"
      />
    </div>
    <div class="form-group">
      <label>Nombre <span class="req">*</span></label>
      <input
        pInputText
        [(ngModel)]="form.nombre"
        placeholder="Nombre de la cuenta"
      />
    </div>
    <div class="form-group">
      <label>Tipo <span class="req">*</span></label>
      <p-dropdown
        [(ngModel)]="form.tipo"
        [options]="tipoOpts"
        optionLabel="label"
        appendTo="body"
        optionValue="value"
        placeholder="Seleccionar"
        styleClass="w-full"
      />
    </div>
    <div class="form-group">
      <label>Naturaleza <span class="req">*</span></label>
      <p-dropdown
        [(ngModel)]="form.naturaleza"
        [options]="naturalezaOpts"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        styleClass="w-full"
      />
    </div>
    <div class="form-group">
      <label>Nivel</label>
      <p-dropdown
        [(ngModel)]="form.nivel"
        [options]="nivelOpts"
        appendTo="body"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
      />
    </div>
    <div class="form-group">
      <label>Cuenta Padre</label>
      <p-dropdown
        [(ngModel)]="form.padreId"
        [options]="padreOpts"
        optionLabel="label"
        appendTo="body"
        optionValue="value"
        placeholder="Sin padre"
        [filter]="true"
        styleClass="w-full"
      />
    </div>
    <div class="form-group">
      <label>Código DIAN</label>
      <input
        pInputText
        [(ngModel)]="form.codigoDian"
        placeholder="Homologación DIAN (opcional)"
      />
    </div>
    <div class="form-group" style="grid-column: 1/-1">
      <label style="display: flex; align-items: center; gap: 0.5rem">
        <p-checkbox [(ngModel)]="form.auxiliar" [binary]="true" />
        Cuenta auxiliar (acepta movimientos)
      </label>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <button
      pButton
      label="Cancelar"
      icon="pi pi-times"
      class="p-button-outlined p-button-secondary"
      (click)="showDialog = false"
    ></button>
    <button
      pButton
      [label]="editId ? 'Actualizar' : 'Guardar'"
      icon="pi pi-check"
      class="btn-aura"
      [loading]="saving"
      [disabled]="!form.codigo || !form.nombre || !form.tipo"
      (click)="guardar()"
    ></button>
  </ng-template>
</p-dialog>
