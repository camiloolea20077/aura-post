<div class="page">
  <div class="card">
    <div class="card-head">
      <div class="card-head__title">
        <span class="header-icon"><i class="pi pi-barcode"></i></span>
        <div>
          <h1 class="title">Seriales</h1>
          <p class="subtitle">
            Control de productos por número de serie individual
          </p>
        </div>
      </div>
      <div class="card-head__actions">
        <button
          pButton
          type="button"
          label="Registrar serial"
          icon="pi pi-plus"
          class="btn-verde"
          (click)="openCreate()"
        ></button>
        <div class="card-head__search">
          <span class="search-wrap">
            <i class="pi pi-search"></i>
            <input
              type="text"
              pInputText
              class="search-input"
              placeholder="Buscar por serial, producto o sucursal..."
              [(ngModel)]="searchQuery"
              (input)="onSearch()"
              (keydown.escape)="clearSearch()"
            />
            <button
              *ngIf="searchQuery"
              class="clear-btn"
              (click)="clearSearch()"
            >
              <i class="pi pi-times"></i>
            </button>
          </span>

          <p-dropdown
            [options]="estadoOpts"
            [(ngModel)]="estadoFiltro"
            optionLabel="label"
            optionValue="value"
            (onChange)="onEstadoChange()"
            styleClass="estado-filter"
          />
        </div>
      </div>
    </div>

    <p-table
      [value]="items"
      [lazy]="true"
      (onLazyLoad)="loadTable($event)"
      [paginator]="true"
      [rows]="rowSize"
      showGridlines
      [totalRecords]="totalRecords"
      [loading]="loadingTable"
      [rowsPerPageOptions]="[10, 15, 25, 50]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}-{last} de {totalRecords}"
      [tableStyle]="{ 'min-width': '600px' }"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="min-width: 170px" class="mono-header">Serial</th>
          <th pSortableColumn="p.nombre" style="min-width: 190px">
            Producto <p-sortIcon field="p.nombre" />
          </th>
          <th style="min-width: 130px">Sucursal</th>
          <th style="width: 120px" class="text-center">Estado</th>
          <th style="width: 80px" class="text-center">Acc.</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-item>
        <tr>
          <!-- Serial -->
          <td>
            <span class="serial-code">{{ item.serial }}</span>
          </td>

          <!-- Producto -->
          <td>
            <div class="cell-producto">
              <div class="prod-avatar">
                {{ item.productoNombre.charAt(0).toUpperCase() }}
              </div>
              <span class="prod-nombre">{{ item.productoNombre }}</span>
            </div>
          </td>

          <!-- Sucursal -->
          <td>
            <span class="sucursal-chip">
              <i class="pi pi-building"></i> {{ item.sucursalNombre }}
            </span>
          </td>

          <!-- Estado -->
          <td class="text-center">
            <p-tag
              [value]="getEstadoLabel(item.estado)"
              [severity]="getEstadoSeverity(item.estado)"
              [rounded]="true"
            />
          </td>

          <!-- Acciones -->
          <td class="text-center">
            <button
              pButton
              type="button"
              icon="pi pi-trash"
              class="p-button-text p-button-danger p-button-sm action-delete"
              pTooltip="Eliminar serial"
              tooltipPosition="top"
              (click)="confirmDelete(item)"
            ></button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5">
            <div class="empty-state">
              <i class="pi pi-barcode"></i>
              <p>
                {{
                  searchQuery ? "Sin resultados" : "No hay seriales registrados"
                }}
              </p>
              <button
                *ngIf="!searchQuery"
                pButton
                type="button"
                label="Registrar primer serial"
                icon="pi pi-plus"
                class="btn-verde"
                (click)="openCreate()"
              ></button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="loadingbody">
        <tr *ngFor="let s of [1, 2, 3, 4, 5]">
          <td><p-skeleton /></td>
          <td><p-skeleton /></td>
          <td><p-skeleton /></td>
          <td class="text-center">
            <p-skeleton width="80px" styleClass="mx-auto" />
          </td>
          <td class="text-center">
            <p-skeleton width="36px" styleClass="mx-auto" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<app-form-serial
  [displayModal]="showModal"
  (modalClosed)="onModalClosed()"
  (itemSaved)="onItemSaved()"
>
</app-form-serial>
<p-toast />
<p-confirmDialog />
