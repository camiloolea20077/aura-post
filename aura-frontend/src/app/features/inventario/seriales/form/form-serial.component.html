<p-dialog
  [(visible)]="displayModal"
  header="Registrar serial"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '440px' }"
  styleClass="aura-dialog"
  (onHide)="closeModal()"
>
  <form [formGroup]="frmSerial" class="form-container">
    <div class="field-row">
      <div class="field">
        <label>Producto <span class="required">*</span></label>
        <p-dropdown
          formControlName="productoId"
          [options]="productosOpts"
          optionLabel="label"
          optionValue="value"
          placeholder="Selecciona..."
          [filter]="true"
          filterPlaceholder="Buscar..."
          styleClass="w-full"
          [class.ng-invalid]="isInvalid('productoId')"
        />
        <small class="p-error" *ngIf="isInvalid('productoId')"
          >Requerido.</small
        >
      </div>
      <div class="field">
        <label>Sucursal <span class="required">*</span></label>
        <p-dropdown
          formControlName="sucursalId"
          [options]="sucursalesOpts"
          optionLabel="label"
          optionValue="value"
          placeholder="Selecciona..."
          styleClass="w-full"
          [class.ng-invalid]="isInvalid('sucursalId')"
        />
        <small class="p-error" *ngIf="isInvalid('sucursalId')"
          >Requerido.</small
        >
      </div>
    </div>

    <div class="field">
      <label>Número de serial <span class="required">*</span></label>
      <input
        type="text"
        pInputText
        formControlName="serial"
        placeholder="Ej: SN-ABC123456"
        [class.ng-invalid]="isInvalid('serial')"
        [class.ng-dirty]="frmSerial.get('serial')?.touched"
        maxlength="100"
        autocomplete="off"
        style="
          text-transform: uppercase;
          font-family: &quot;JetBrains Mono&quot;, monospace;
        "
      />
      <small class="p-error" *ngIf="isInvalid('serial')"
        >El serial es obligatorio (mín. 2 caracteres).</small
      >
    </div>

    <div class="field">
      <label>Estado inicial</label>
      <p-dropdown
        formControlName="estado"
        [options]="estadoOpts"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
      />
      <small class="field-hint">
        <i class="pi pi-info-circle"></i> Normalmente se registra como
        "Disponible"
      </small>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <div class="dialog-footer">
      <button
        pButton
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        class="p-button-outlined p-button-secondary"
        [disabled]="isSubmitting"
        (click)="closeModal()"
      ></button>
      <button
        pButton
        type="button"
        label="Registrar"
        [icon]="isSubmitting ? 'pi pi-spin pi-spinner' : 'pi pi-check'"
        class="btn-aura"
        [disabled]="isSubmitting"
        (click)="saveItem()"
      ></button>
    </div>
  </ng-template>
</p-dialog>
<p-toast />
