<p-dialog
  [(visible)]="displayModal"
  header="Registrar lote"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '500px' }"
  styleClass="aura-dialog"
  (onHide)="closeModal()"
>
  <form [formGroup]="frmLote" class="form-container">
    <div class="info-banner">
      <i class="pi pi-info-circle"></i>
      <span
        >Los lotes no se editan. Para corregir stock usa una compra o una
        merma.</span
      >
    </div>

    <div class="field-row">
      <div class="field">
        <label>Producto <span class="required">*</span></label>
        <p-dropdown
          formControlName="productoId"
          [options]="productosOpts"
          optionLabel="label"
          optionValue="value"
          placeholder="Selecciona..."
          [filter]="true"
          filterPlaceholder="Buscar..."
          styleClass="w-full"
          [class.ng-invalid]="isInvalid('productoId')"
        />
        <small class="p-error" *ngIf="isInvalid('productoId')"
          >Requerido.</small
        >
      </div>
      <div class="field">
        <label>Sucursal <span class="required">*</span></label>
        <p-dropdown
          formControlName="sucursalId"
          [options]="sucursalesOpts"
          optionLabel="label"
          optionValue="value"
          placeholder="Selecciona..."
          styleClass="w-full"
          [class.ng-invalid]="isInvalid('sucursalId')"
        />
        <small class="p-error" *ngIf="isInvalid('sucursalId')"
          >Requerido.</small
        >
      </div>
    </div>

    <div class="field">
      <label>Código de lote <span class="required">*</span></label>
      <input
        type="text"
        pInputText
        formControlName="codigoLote"
        placeholder="Ej: LOT-2025-001"
        [class.ng-invalid]="isInvalid('codigoLote')"
        [class.ng-dirty]="frmLote.get('codigoLote')?.touched"
        maxlength="80"
        autocomplete="off"
        style="text-transform: uppercase"
      />
      <small class="p-error" *ngIf="isInvalid('codigoLote')"
        >El código es obligatorio (mín. 2 caracteres).</small
      >
    </div>

    <div class="field">
      <label
        >Fecha de vencimiento <span class="optional">(opcional)</span></label
      >
      <p-calendar
        formControlName="fechaVencimiento"
        dateFormat="dd/mm/yy"
        placeholder="dd/mm/aaaa"
        [showButtonBar]="true"
        styleClass="w-full"
      />
      <!-- Indicador días para vencer -->
      <div
        class="dias-badge"
        [ngClass]="diasClass"
        *ngIf="diasParaVencer !== null"
      >
        <i class="pi pi-clock"></i> {{ diasLabel }}
      </div>
    </div>

    <p-divider align="left"
      ><span class="divider-label">Cantidades</span></p-divider
    >

    <div class="field-row">
      <div class="field">
        <label>Stock inicial <span class="required">*</span></label>
        <p-inputNumber
          formControlName="stockActual"
          [min]="0.0001"
          [maxFractionDigits]="4"
          styleClass="w-full"
          [class.ng-invalid]="isInvalid('stockActual')"
          placeholder="0"
        />
        <small class="p-error" *ngIf="isInvalid('stockActual')"
          >Debe ser mayor a 0.</small
        >
      </div>
      <div class="field">
        <label>Costo unitario <span class="required">*</span></label>
        <p-inputNumber
          formControlName="costoUnitario"
          mode="currency"
          currency="COP"
          locale="es-CO"
          [minFractionDigits]="0"
          [min]="0.01"
          styleClass="w-full"
          [class.ng-invalid]="isInvalid('costoUnitario')"
        />
        <small class="p-error" *ngIf="isInvalid('costoUnitario')"
          >Requerido.</small
        >
      </div>
    </div>

    <div class="field-inline">
      <div class="switch-label">
        <span class="label-text">Estado del lote</span>
        <span class="label-sub">{{
          frmLote.get("activo")?.value
            ? "Activo — disponible para ventas"
            : "Inactivo"
        }}</span>
      </div>
      <p-inputSwitch formControlName="activo" />
    </div>
  </form>

  <ng-template pTemplate="footer">
    <div class="dialog-footer">
      <button
        pButton
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        class="p-button-outlined p-button-secondary"
        [disabled]="isSubmitting"
        (click)="closeModal()"
      ></button>
      <button
        pButton
        type="button"
        label="Registrar lote"
        [icon]="isSubmitting ? 'pi pi-spin pi-spinner' : 'pi pi-check'"
        class="btn-aura"
        [disabled]="isSubmitting"
        (click)="saveItem()"
      ></button>
    </div>
  </ng-template>
</p-dialog>
<p-toast />
