<p-dialog
  [(visible)]="displayModal"
  [header]="isEditMode ? 'Editar lista de precios' : 'Nueva lista de precios'"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '420px' }"
  styleClass="aura-dialog"
  (onHide)="closeModal()"
>
  <div class="dialog-loading" *ngIf="isLoading">
    <i class="pi pi-spin pi-spinner"></i><span>Cargando...</span>
  </div>

  <form [formGroup]="frmLista" class="form-container" *ngIf="!isLoading">
    <div class="field">
      <label for="nombre">Nombre <span class="required">*</span></label>
      <input
        id="nombre"
        type="text"
        pInputText
        formControlName="nombre"
        placeholder="Ej: Lista General, Mayorista, Domicilios..."
        [class.ng-invalid]="isInvalid('nombre')"
        [class.ng-dirty]="frmLista.get('nombre')?.touched"
        maxlength="100"
        autocomplete="off"
      />
      <small class="p-error" *ngIf="isInvalid('nombre')">
        <ng-container *ngIf="frmLista.get('nombre')?.hasError('required')"
          >El nombre es obligatorio.</ng-container
        >
        <ng-container *ngIf="frmLista.get('nombre')?.hasError('minlength')"
          >Mínimo 2 caracteres.</ng-container
        >
      </small>
    </div>

    <div class="field-inline">
      <div class="switch-label">
        <span class="label-text">Estado</span>
        <span class="label-sub">
          {{
            frmLista.get("activa")?.value
              ? "Activa — disponible para asignar precios"
              : "Inactiva"
          }}
        </span>
      </div>
      <p-inputSwitch formControlName="activa" />
    </div>
  </form>

  <ng-template pTemplate="footer">
    <div class="dialog-footer">
      <button
        pButton
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        class="btn-amarillo"
        [disabled]="isSubmitting"
        (click)="closeModal()"
      ></button>
      <button
        pButton
        type="button"
        [label]="isEditMode ? 'Actualizar' : 'Guardar'"
        [icon]="isSubmitting ? 'pi pi-spin pi-spinner' : 'pi pi-check'"
        class="btn-verde"
        [disabled]="isSubmitting || isLoading"
        (click)="saveLista()"
      ></button>
    </div>
  </ng-template>
</p-dialog>
<p-toast />
