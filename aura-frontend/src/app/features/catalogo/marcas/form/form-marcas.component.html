<p-dialog
  [(visible)]="displayModal"
  [header]="isEditMode ? 'Editar marca' : 'Nueva marca'"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '420px' }"
  styleClass="aura-dialog"
  (onHide)="closeModal()"
>
  <div class="dialog-loading" *ngIf="isLoading">
    <i class="pi pi-spin pi-spinner"></i>
    <span>Cargando datos...</span>
  </div>

  <form
    [formGroup]="frmMarca"
    (ngSubmit)="saveMarca()"
    class="form-container"
    *ngIf="!isLoading"
  >
    <div class="field">
      <label for="nombre">Nombre <span class="required">*</span></label>
      <input
        id="nombre"
        type="text"
        pInputText
        formControlName="nombre"
        placeholder="Ej: Samsung, Nike, Alpina..."
        [class.ng-invalid]="isInvalid('nombre')"
        [class.ng-dirty]="frmMarca.get('nombre')?.touched"
        maxlength="150"
        autocomplete="off"
      />
      <small class="p-error" *ngIf="isInvalid('nombre')">
        <ng-container *ngIf="frmMarca.get('nombre')?.hasError('required')"
          >El nombre es obligatorio.</ng-container
        >
        <ng-container *ngIf="frmMarca.get('nombre')?.hasError('minlength')"
          >Mínimo 2 caracteres.</ng-container
        >
      </small>
    </div>

    <div class="field-inline">
      <div class="switch-label">
        <span class="label-text">Estado</span>
        <span class="label-sub">
          {{ frmMarca.get("activo")?.value ? "Activo" : "Inactivo" }}
        </span>
      </div>
      <p-inputSwitch formControlName="activo" />
    </div>
  </form>

  <ng-template pTemplate="footer">
    <div class="dialog-footer">
      <button
        pButton
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        class="p-button-outlined p-button-secondary"
        [disabled]="isSubmitting"
        (click)="closeModal()"
      ></button>
      <button
        pButton
        type="button"
        [label]="isEditMode ? 'Actualizar' : 'Guardar'"
        [icon]="isSubmitting ? 'pi pi-spin pi-spinner' : 'pi pi-check'"
        class="btn-aura"
        [disabled]="isSubmitting || isLoading"
        (click)="saveMarca()"
      ></button>
    </div>
  </ng-template>
</p-dialog>

<p-toast />
