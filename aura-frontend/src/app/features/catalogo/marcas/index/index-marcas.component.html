<div class="page">
  <div class="card">
    <div class="card-head">
      <div class="card-head__title">
        <span class="header-icon">
          <i class="pi pi-tag"></i>
        </span>
        <div>
          <h1 class="title">Marcas</h1>
          <p class="subtitle">Administra las marcas de tus productos</p>
        </div>
      </div>
      <div class="card-head__actions">
        <button
          pButton
          type="button"
          label="Nueva marca"
          icon="pi pi-plus"
          class="btn-verde"
          (click)="openCreate()"
        ></button>
        <div class="card-head__search">
          <span class="search-wrap">
            <i class="pi pi-search"></i>
            <input
              type="text"
              pInputText
              class="search-input"
              placeholder="Buscar marca..."
              [(ngModel)]="searchQuery"
              (input)="filterGlobal($event)"
            />
            <button
              *ngIf="searchQuery"
              class="clear-btn"
              (click)="clearSearch()"
            >
              <i class="pi pi-times"></i>
            </button>
          </span>
        </div>
      </div>
    </div>

    <p-table
      [value]="items"
      [columns]="cols"
      [lazy]="true"
      (onLazyLoad)="loadTable($event)"
      [paginator]="true"
      [rows]="rowSize"
      showGridlines
      [totalRecords]="totalRecords"
      [loading]="loadingTable"
      [rowsPerPageOptions]="[10, 25, 50]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}-{last} de {totalRecords} registros"
      [tableStyle]="{ 'min-width': '400px' }"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="nombre" style="min-width: 200px">
            Nombre <p-sortIcon field="nombre" />
          </th>
          <th pSortableColumn="activo" style="width: 110px" class="text-center">
            Estado <p-sortIcon field="activo" />
          </th>
          <th style="width: 110px" class="text-center">Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-item>
        <tr>
          <td>
            <div class="cell-nombre">
              <div class="marca-avatar">
                {{ item.nombre.charAt(0).toUpperCase() }}
              </div>
              <span class="nombre-text">{{ item.nombre }}</span>
            </div>
          </td>
          <td class="text-center">
            <p-tag
              [value]="item.activo ? 'Activo' : 'Inactivo'"
              [severity]="item.activo ? 'success' : 'danger'"
              [rounded]="true"
            />
          </td>
          <td class="text-center">
            <div class="action-buttons">
              <button
                pButton
                type="button"
                icon="pi pi-pencil"
                class="p-button-text p-button-sm action-edit"
                pTooltip="Editar"
                tooltipPosition="top"
                (click)="openEdit(item)"
              ></button>
              <button
                pButton
                type="button"
                icon="pi pi-trash"
                class="p-button-text p-button-danger p-button-sm action-delete"
                pTooltip="Eliminar"
                tooltipPosition="top"
                (click)="confirmDelete(item)"
              ></button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="3">
            <div class="empty-state">
              <i class="pi pi-tag"></i>
              <p>
                {{
                  searchQuery
                    ? 'Sin resultados para "' + searchQuery + '"'
                    : "No hay marcas registradas"
                }}
              </p>
              <button
                *ngIf="!searchQuery"
                pButton
                type="button"
                label="Crear primera marca"
                icon="pi pi-plus"
                class="btn-verde p-button-sm"
                (click)="openCreate()"
              ></button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="loadingbody">
        <tr *ngFor="let s of [1, 2, 3, 4, 5]">
          <td><p-skeleton /></td>
          <td class="text-center">
            <p-skeleton width="70px" styleClass="mx-auto" />
          </td>
          <td class="text-center">
            <p-skeleton width="80px" styleClass="mx-auto" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<app-form-marcas
  [displayModal]="showModal"
  [marcaId]="selectedId"
  [slug]="modalSlug"
  (modalClosed)="onModalClosed()"
  (marcaSaved)="onItemSaved()"
>
</app-form-marcas>

<p-toast />
<p-confirmDialog />
