<div class="page-container">
  <div class="page-header">
    <div class="header-left">
      <div class="header-icon">
        <i class="pi pi-users"></i>
      </div>
      <div>
        <h1 class="header-title">Tipos de Empleado</h1>
        <p class="header-sub">Gestión de tipos de empleado</p>
      </div>
    </div>
    <div class="header-actions">
      <button
        pButton
        label="Nuevo Tipo"
        icon="pi pi-plus"
        class="btn-primary"
        (click)="nuevo()"
      ></button>
    </div>
  </div>

  <div class="table-card">
    <p-table
      [value]="rows"
      [loading]="loading"
      [paginator]="totalRows > 10"
      [rows]="10"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
      styleClass="p-datatable-sm"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 80px">ID</th>
          <th>Nombre</th>
          <th>Descripción</th>
          <th style="width: 100px">Estado</th>
          <th style="width: 120px">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row>
        <tr>
          <td class="mono">{{ row.id }}</td>
          <td class="fw-600">{{ row.nombre }}</td>
          <td class="text-muted">{{ row.descripcion || '-' }}</td>
          <td>
            <span
              [class]="
                'status-badge ' + (row.activo ? 'status-active' : 'status-inactive')
              "
            >
              {{ row.activo ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
          <td>
            <div class="action-buttons">
              <button
                pButton
                icon="pi pi-pencil"
                class="p-button-text p-button-sm"
                (click)="editar(row)"
                pTooltip="Editar"
              ></button>
              <button
                pButton
                icon="pi pi-trash"
                class="p-button-text p-button-danger p-button-sm"
                (click)="eliminar(row)"
                pTooltip="Eliminar"
              ></button>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="empty-row">
            No hay tipos de empleado registrados
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<app-form-tipo-empleado
  [(visible)]="showForm"
  [tipoEmpleado]="tipoEmpleadoEdit"
  (saved)="onSaved()"
></app-form-tipo-empleado>

<p-confirmDialog></p-confirmDialog>
