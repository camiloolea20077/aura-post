<div class="module-container">
  <!-- Header -->
  <div class="module-header">
    <div class="header-left">
      <div class="header-icon">
        <i class="pi pi-tag"></i>
      </div>
      <div>
        <h2 class="header-title">Motivos de Merma</h2>
        <p class="header-sub">
          Configura los motivos por los que se registran pérdidas
        </p>
      </div>
    </div>
    <button
      pButton
      label="Nuevo motivo"
      icon="pi pi-plus"
      class="btn-aura"
      (click)="openCreate()"
    ></button>
  </div>

  <!-- Toolbar -->
  <div class="table-toolbar">
    <span class="search-wrap">
      <i class="pi pi-search"></i>
      <input
        type="text"
        pInputText
        placeholder="Buscar motivo..."
        [(ngModel)]="search"
        (input)="onSearch()"
        class="search-input"
      />
    </span>
  </div>

  <!-- Tabla -->
  <div class="table-card">
    <p-table
      [value]="rows"
      [lazy]="true"
      [loading]="loading"
      [totalRecords]="totalRows"
      [rows]="pageSize"
      [paginator]="true"
      [rowsPerPageOptions]="[10, 25, 50]"
      (onPage)="onPage($event)"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} - {last} de {totalRecords}"
      styleClass="p-datatable-sm p-datatable-gridlines"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 60px">#</th>
          <th>Nombre</th>
          <th style="width: 180px">Afecta contabilidad</th>
          <th style="width: 120px">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-m let-i="rowIndex">
        <tr>
          <td class="text-muted mono">{{ i + 1 }}</td>
          <td class="fw-600">{{ m.nombre }}</td>
          <td>
            <p-tag
              [value]="m.afectaContabilidad ? 'Sí' : 'No'"
              [severity]="m.afectaContabilidad ? 'success' : 'secondary'"
            />
          </td>
          <td>
            <div class="actions">
              <button
                pButton
                icon="pi pi-pencil"
                class="p-button-text p-button-sm"
                pTooltip="Editar"
                (click)="openEdit(m)"
              ></button>
              <button
                pButton
                icon="pi pi-trash"
                class="p-button-text p-button-danger p-button-sm"
                pTooltip="Eliminar"
                (click)="confirmDelete(m)"
              ></button>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="empty-row">No hay motivos registrados</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<app-form-motivo
  [(visible)]="showForm"
  [motivo]="selected"
  (saved)="onSaved()"
/>

<p-confirmDialog />
<p-toast />
