<div class="page">
  <div class="card">
    <div class="card-head">
      <div class="card-head__title">
        <span class="header-icon">
          <i class="pi pi-credit-card"></i>
        </span>
        <div>
          <h1 class="title">Cuentas Bancarias</h1>
          <p class="subtitle">
            Administra tus cuentas, cajas y billeteras digitales
          </p>
        </div>
      </div>
      <div class="card-head__actions">
        <button
          pButton
          type="button"
          label="Nueva Cuenta"
          icon="pi pi-plus"
          class="btn-aura"
          (click)="abrirNueva()"
        ></button>
        <div class="card-head__search">
          <span class="search-wrap">
            <i class="pi pi-search"></i>
            <input
              type="text"
              pInputText
              class="search-input"
              placeholder="Buscar código, cuenta, banco, número..."
              [(ngModel)]="searchQuery"
              (input)="dt.filterGlobal($any($event.target).value, 'contains')"
            />
            <button
              *ngIf="searchQuery"
              class="clear-btn"
              (click)="clearSearch(dt)"
            >
              <i class="pi pi-times"></i>
            </button>
          </span>
          <button
            pButton
            type="button"
            icon="pi pi-refresh"
            class="p-button-text p-button-rounded"
            pTooltip="Recargar"
            (click)="cargar()"
            [loading]="loading"
          ></button>
        </div>
      </div>
    </div>

    <!-- ── Tabla de cuentas ───────────────────────────────────────── -->
    <p-table
      #dt
      [value]="cuentas"
      [loading]="loading"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}-{last} de {totalRecords} registros"
      [globalFilterFields]="[
        'codigo',
        'nombre',
        'banco',
        'numeroCuenta',
        'cuentaContableNombre',
        'tipo',
        'titular',
      ]"
      styleClass="p-datatable-sm"
    >
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 100px">Código</th>
          <th>Nombre</th>
          <th style="width: 110px">Tipo</th>
          <th style="min-width: 140px">Banco</th>
          <th style="width: 130px">N° cuenta</th>
          <th style="min-width: 180px">Cuenta contable</th>
          <th style="width: 90px" class="text-center">Estado</th>
          <th style="width: 100px" class="text-center">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-c>
        <tr [class.inactiva-row]="!c.activa">
          <td>
            <code class="cb-codigo" *ngIf="c.codigo">{{ c.codigo }}</code>
            <span *ngIf="!c.codigo" class="sin-dato">—</span>
          </td>
          <td>{{ c.nombre }}</td>
          <td>
            <p-tag
              [value]="getTipoMeta(c.tipo).label"
              [style.background]="'#2563eb'"
              [style.color]="'#ffffff'"
            />
          </td>
          <td>{{ c.banco || "—" }}</td>
          <td>{{ maskCuenta(c.numeroCuenta) }}</td>
          <td>{{ c.cuentaContableNombre || "—" }}</td>
          <td class="text-center">
            <p-tag
              [value]="c.activa ? 'Activa' : 'Inactiva'"
              [severity]="c.activa ? 'success' : 'danger'"
            />
          </td>
          <td class="text-center flex">
            <button
              pButton
              icon="pi pi-pencil"
              class="p-button-text p-button-sm"
              pTooltip="Editar"
              (click)="abrirEditar(c)"
            ></button>
            <button
              pButton
              [icon]="c.activa ? 'pi pi-eye-slash' : 'pi pi-eye'"
              class="p-button-text p-button-sm"
              [pTooltip]="c.activa ? 'Desactivar' : 'Activar'"
              (click)="toggleActiva(c)"
            ></button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td
            colspan="8"
            style="text-align: center; padding: 2rem; color: #94a3b8"
          >
            No hay cuentas bancarias registradas.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-toast />
