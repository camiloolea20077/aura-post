<div class="page">
  <form [formGroup]="frm" (ngSubmit)="guardar()">
    <div class="card">
      <!-- ── Header dentro de la card ─────────────────────────── -->
      <div class="card-head">
        <div class="card-head__title">
          <p-button
            icon="pi pi-arrow-left"
            [rounded]="true"
            [text]="true"
            (onClick)="cancelar()"
          />
          <span class="header-icon"><i class="pi pi-users"></i></span>
          <div>
            <h1 class="title">
              {{ isEdit ? "Editar tercero" : "Nuevo tercero" }}
            </h1>
            <p class="subtitle">Clientes, proveedores, empleados y bancos</p>
          </div>
        </div>
      </div>

      <div class="form-body">
        <!-- ── Clasificación ──────────────────────────────────── -->
        <h3 class="section">Clasificación</h3>
        <div class="grid">
          <div class="field">
            <label>Tipo de tercero</label>
            <p-multiSelect
              [options]="rolOpts"
              [(ngModel)]="roles"
              [ngModelOptions]="{ standalone: true }"
              (onChange)="onRolesChange()"
              optionLabel="label"
              optionValue="value"
              placeholder="Cliente, Proveedor, Empleado o Banco"
              display="chip"
              styleClass="w-full"
            />
          </div>

          <div class="field">
            <label>Tipo de persona</label>
            <p-dropdown
              formControlName="tipoPersona"
              [options]="tipoPersonaOpts"
              optionLabel="label"
              optionValue="value"
              (onChange)="onTipoPersonaChange()"
              [disabled]="esBanco"
              styleClass="w-full"
            />
          </div>
        </div>

        <!-- ── Identificación ─────────────────────────────────── -->
        <h3 class="section">Identificación</h3>
        <div class="grid">
          <div class="field">
            <label>Tipo de documento</label>
            <p-dropdown
              formControlName="tipoDocumento"
              [options]="tipoDocOpts"
              optionLabel="label"
              optionValue="value"
              styleClass="w-full"
            />
          </div>
          <div class="field">
            <label>Número <span class="req">*</span></label>
            <input
              pInputText
              formControlName="numeroDocumento"
              class="w-full"
              placeholder="Ej: 900123456"
            />
          </div>

          @if (esJuridica) {
            <div class="field">
              <label>Dígito verif. (DV)</label>
              <input
                pInputText
                formControlName="dv"
                class="w-full"
                placeholder="DV"
              />
            </div>
            <div class="field">
              <label>Razón social <span class="req">*</span></label>
              <input
                pInputText
                formControlName="razonSocial"
                class="w-full"
                placeholder="Nombre de la empresa"
              />
            </div>
          } @else {
            <div class="field">
              <label>Nombres <span class="req">*</span></label>
              <input
                pInputText
                formControlName="nombres"
                class="w-full"
                placeholder="Nombres"
              />
            </div>
            <div class="field">
              <label>Apellidos</label>
              <input
                pInputText
                formControlName="apellidos"
                class="w-full"
                placeholder="Apellidos"
              />
            </div>
          }
        </div>

        <!-- ── Contacto ───────────────────────────────────────── -->
        @if (!esBanco) {
          <h3 class="section">Contacto</h3>
          <div class="grid">
            <div class="field">
              <label>Teléfono</label>
              <input pInputText formControlName="telefono" class="w-full" />
            </div>
            <div class="field">
              <label>Correo</label>
              <input pInputText formControlName="email" class="w-full" />
            </div>
            <div class="field">
              <label>Dirección</label>
              <input pInputText formControlName="direccion" class="w-full" />
            </div>
            <div class="field">
              <label>País</label>
              <input pInputText formControlName="pais" class="w-full" />
            </div>
            <div class="field full">
              <label>Municipio</label>
              <p-dropdown
                formControlName="municipioId"
                [options]="municipioOpts"
                optionLabel="label"
                optionValue="value"
                placeholder="Buscar municipio..."
                [filter]="true"
                (onFilter)="onMunicipioFilter($event)"
                [virtualScroll]="true"
                [virtualScrollItemSize]="38"
                [showClear]="true"
                [loading]="municipioLoading"
                filterPlaceholder="Escribe para buscar..."
                emptyFilterMessage="Escribe para buscar municipios"
                styleClass="w-full"
              />
            </div>
          </div>
        }

        <!-- ── Información fiscal ──────────────────────────────── -->
        <h3 class="section">Información fiscal</h3>
        <div class="grid">
          <div class="field">
            <label>Correo facturación</label>
            <input
              pInputText
              formControlName="emailFe"
              class="w-full"
              placeholder="Factura electrónica"
            />
          </div>
          <div class="field">
            <label>Régimen</label>
            <p-dropdown
              formControlName="regimen"
              [options]="regimenOpts"
              optionLabel="label"
              optionValue="value"
              styleClass="w-full"
            />
          </div>
          <div class="field">
            <label>Responsabilidad fiscal</label>
            <p-dropdown
              formControlName="responsabilidadFiscal"
              [options]="respFiscalOpts"
              optionLabel="label"
              optionValue="value"
              [showClear]="true"
              placeholder="Opcional"
              styleClass="w-full"
            />
          </div>
          <div class="field">
            <label>Código CIIU</label>
            <input
              pInputText
              formControlName="codigoCIIU"
              class="w-full"
              placeholder="Opcional"
            />
          </div>
          <div class="field full">
            <label>Actividad económica</label>
            <input
              pInputText
              formControlName="actividadEconomica"
              class="w-full"
              placeholder="Opcional"
            />
          </div>
          <div class="field switch">
            <label>Gran contribuyente</label>
            <p-toggleswitch formControlName="granContribuyente" />
          </div>
          <div class="field switch">
            <label>Autorretenedor</label>
            <p-toggleswitch formControlName="autoRetenedor" />
          </div>
          <div class="field switch">
            <label>Activo</label>
            <p-toggleswitch formControlName="activo" />
          </div>
        </div>
      </div>
      <!-- /form-body -->

      <div class="card-footer">
        <p-button
          label="Cancelar"
          severity="secondary"
          [text]="true"
          (onClick)="cancelar()"
        />
        <p-button
          [label]="isEdit ? 'Actualizar' : 'Crear tercero'"
          icon="pi pi-check"
          type="submit"
          styleClass="btn-aura"
          [loading]="saving"
        />
      </div>
    </div>
  </form>
</div>
