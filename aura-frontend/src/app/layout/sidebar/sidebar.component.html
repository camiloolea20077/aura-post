<aside class="aura-sidebar" [class.collapsed]="collapsed">
  <!-- ─── Logo ──────────────────────────────────── -->
  <div class="sidebar-logo">
    <div class="logo-brand" *ngIf="!collapsed">
      <div class="logo-icon-box">
        <img
          *ngIf="logoSafeUrl"
          [src]="logoSafeUrl"
          alt="Logo AURA NUBE"
          class="logo-img"
        />
      </div>
      <div class="logo-texts">
        <span class="logo-name">AURA <span>NUBE</span></span>
        <span class="logo-empresa" *ngIf="empresaNombre">{{
          empresaNombre
        }}</span>
      </div>
    </div>
    <div class="logo-brand centered" *ngIf="collapsed">
      <div class="logo-icon-box">A</div>
    </div>
    <button
      class="collapse-btn"
      (click)="toggleCollapse.emit()"
      [pTooltip]="collapsed ? 'Expandir' : 'Colapsar'"
      tooltipPosition="right"
    >
      <i [class]="collapsed ? 'pi pi-chevron-right' : 'pi pi-chevron-left'"></i>
    </button>
  </div>

  <!-- ─── Navigation ────────────────────────────── -->
  <nav class="sidebar-nav">
    <ng-container *ngFor="let group of menuGroups">
      <div class="nav-group" [class.group-open]="isOpen(group)">
        <!-- Header del grupo (colapsable) -->
        <button
          class="nav-group-header"
          (click)="toggleGroup(group)"
          [class.always-open]="group.alwaysOpen"
          [pTooltip]="collapsed ? group.label : ''"
          tooltipPosition="right"
        >
          <i [class]="group.icon + ' group-icon'"></i>

          <span class="nav-group-label" *ngIf="!collapsed">{{
            group.label
          }}</span>

          <i
            class="pi pi-chevron-down group-chevron"
            *ngIf="!collapsed && !group.alwaysOpen"
            [class.rotated]="isOpen(group)"
          ></i>
        </button>

        <!-- Items del grupo -->
        <div class="nav-group-items" [class.open]="isOpen(group)">
          <a
            *ngFor="let item of group.items"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-item"
            [class.highlight]="item.highlight"
            [pTooltip]="collapsed ? item.label : ''"
            tooltipPosition="right"
          >
            <i [class]="item.icon + ' nav-icon'"></i>
            <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
            <span class="nav-badge" *ngIf="item.badge && !collapsed">{{
              item.badge
            }}</span>
            <span class="nav-badge-dot" *ngIf="item.badge && collapsed"></span>
          </a>
        </div>
      </div>
    </ng-container>
  </nav>

  <!-- ─── Footer ────────────────────────────────── -->
  <div class="sidebar-footer">
    <ng-container *ngIf="!collapsed">
      <div class="user-info">
        <div class="user-avatar">{{ userInitials }}</div>
        <div class="user-details">
          <span class="user-name">{{ userName }}</span>
          <span class="user-role">{{ userRole }}</span>
        </div>
      </div>
      <button
        class="logout-btn"
        (click)="confirmLogout()"
        pTooltip="Cerrar sesión"
        tooltipPosition="top"
      >
        <i class="pi pi-sign-out"></i>
      </button>
    </ng-container>

    <ng-container *ngIf="collapsed">
      <button
        class="logout-btn centered"
        (click)="confirmLogout()"
        class="btn-aura"
        pTooltip="Cerrar sesión"
        tooltipPosition="right"
      >
        <i class="pi pi-sign-out"></i>
      </button>
    </ng-container>
  </div>
</aside>

<p-confirmDialog />
