<div
  class="aura-layout"
  [class.sidebar-collapsed]="sidebarCollapsed"
  [class.no-sidebar]="isCajero"
>
  <p-toast position="top-right" />

  <!-- Backdrop para cerrar el drawer del cajero -->
  <div
    class="sidebar-backdrop"
    *ngIf="isCajero && drawerOpen"
    (click)="closeDrawer()"
  ></div>

  <!-- Sidebar: siempre visible para roles normales; drawer overlay para cajero -->
  @if (!state.isMobile()) {
    <app-sidebar
      *ngIf="!isCajero || drawerOpen"
      [collapsed]="isCajero ? false : sidebarCollapsed"
      (toggleCollapse)="isCajero ? closeDrawer() : toggleSidebar()"
    />
  }

  <!-- Main area -->
  <div class="aura-main">
    <!-- Topbar -->
    <app-topbar
      [sidebarCollapsed]="sidebarCollapsed"
      (toggleSidebar)="toggleSidebar()"
    />

    <!-- Page content -->
    <main class="aura-content">
      <router-outlet />
    </main>
  </div>
</div>
