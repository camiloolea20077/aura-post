<div class="aura-layout" [class.sidebar-collapsed]="sidebarCollapsed">

  <!-- Sidebar -->
  <app-sidebar
    [collapsed]="sidebarCollapsed"
    (toggleCollapse)="toggleSidebar()"
  />

  <!-- Main area -->
  <div class="aura-main">

    <!-- Topbar -->
    <app-topbar
      [sidebarCollapsed]="sidebarCollapsed"
      (toggleSidebar)="toggleSidebar()"
    />

    <!-- Page content -->
    <main class="aura-content">
      <router-outlet />
    </main>

  </div>

</div>
