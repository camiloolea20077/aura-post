<header class="aura-topbar">
  <!-- ─── Left ──────────────────────────────────── -->
  <div class="topbar-left">
    <!-- Hamburger (solo desktop) -->
    @if (!state.isMobile()) {
      <button
        class="topbar-btn hamburger"
        (click)="toggleSidebar.emit()"
        pTooltip="Colapsar menú"
        tooltipPosition="bottom"
      >
        <i class="pi pi-bars"></i>
      </button>
    }

    <!-- Breadcrumbs -->
    <nav class="breadcrumb-nav">
      <ng-container
        *ngFor="let crumb of breadcrumbs; let last = last; let first = first"
      >
        <ng-container *ngIf="!last">
          <a [routerLink]="crumb.route" class="breadcrumb-link">{{
            crumb.label
          }}</a>
          <i class="pi pi-angle-right breadcrumb-sep"></i>
        </ng-container>
        <span *ngIf="last" class="breadcrumb-current">{{ crumb.label }}</span>
      </ng-container>
    </nav>
  </div>

  <!-- ─── Right ─────────────────────────────────── -->
  <div class="topbar-right">
    <!-- Reloj -->
    <div class="topbar-clock">
      <span class="clock-time">{{ currentTime }}</span>
      <span class="clock-date">{{ currentDate }}</span>
    </div>

    <!-- Selector de sucursal (con formControlName en lugar de ngModel) -->
    <form [formGroup]="frmTopbar" class="sucursal-form">
      <div class="sucursal-selector">
        <i class="pi pi-map-marker sucursal-icon"></i>
        <p-dropdown
          formControlName="sucursalId"
          [options]="sucursales"
          optionLabel="label"
          optionValue="value"
          styleClass="sucursal-dropdown"
          [showClear]="false"
        />
      </div>
    </form>

    <!-- Indicador turno -->
    <div class="turno-chip" *ngIf="turnoActivo">
      <span class="turno-dot"></span>
      <span>Turno abierto</span>
    </div>

    <!-- Modo oscuro -->
    <!-- <button
      class="topbar-btn"
      (click)="toggleDarkMode()"
      [pTooltip]="darkMode ? 'Modo claro' : 'Modo oscuro'"
      tooltipPosition="bottom"
    >
      <i [class]="darkMode ? 'pi pi-sun' : 'pi pi-moon'"></i>
    </button> -->

    <!-- Notificaciones -->
    <button
      class="topbar-btn notif-btn"
      (click)="notifPanel.toggle($event)"
      pTooltip="Notificaciones"
      tooltipPosition="bottom"
    >
      <i class="pi pi-bell"></i>
      <span class="notif-dot" *ngIf="notifCount > 0">{{ notifCount }}</span>
    </button>

    <p-overlayPanel #notifPanel styleClass="notif-panel">
      <div class="notif-header">
        <span>Notificaciones</span>
      </div>
      <div class="notif-empty">
        <i class="pi pi-check-circle"></i>
        <span>Todo al día</span>
      </div>
    </p-overlayPanel>

    <!-- Separador -->
    <div class="topbar-divider"></div>

    <!-- Usuario -->
    <div class="topbar-user" (click)="userPanel.toggle($event)">
      <div class="user-avatar-sm">{{ userName | slice: 0 : 1 }}</div>
      <span class="user-name-sm">{{ userName }}</span>
      <i class="pi pi-angle-down"></i>
    </div>

    <p-overlaypanel #userPanel styleClass="user-panel">
      <div class="user-menu">
        <div class="user-menu-header">
          <div class="user-avatar-lg">{{ userName | slice: 0 : 1 }}</div>
          <div>
            <p class="user-full-name">{{ userName }}</p>
          </div>
        </div>
        <div class="user-menu-divider"></div>
        <a
          routerLink="/perfil"
          class="user-menu-item"
          (click)="userPanel.hide()"
        >
          <i class="pi pi-user"></i> Mi perfil
        </a>
        <a
          routerLink="/configuracion"
          class="user-menu-item"
          (click)="userPanel.hide()"
        >
          <i class="pi pi-cog"></i> Configuración
        </a>
      </div>
    </p-overlaypanel>

    <!-- Mobile Menu Button -->
    @if (state.isMobile()) {
      <app-mobile-menu
        [userName]="userName"
        (closeMenu)="onMobileMenuClose()"
        (logout)="onLogout()"
      />
    }
  </div>
</header>
